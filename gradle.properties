# TeaVM now runs in its own process (teavm.js outOfProcess = true), so the whole-program
# analysis lives on `processMemory` in build.gradle, not here. This heap is only Gradle's.
# -Xss applies to GRADLE ONLY. It does NOT reach TeaVM's compiler, which is the thing that
# actually overflows: with outOfProcess=true the plugin forks BuildDaemon with exactly
# "-cp ... -XX:+HeapDumpOnOutOfMemoryError -Xmx<processMemory>m" and no -Xss, so the compiler
# ran on the 1 MB default. This comment previously claimed the forked process inherits the
# setting; it does not, and that mistake is why raising this value kept seeming to fix
# StackOverflowError builds and then not fixing them. The real fix is JAVA_TOOL_OPTIONS in
# CompileJS.sh - see the comment there. Left at 1g because it is a reservation, not an
# allocation, and 1g is the ceiling in practice: -Xss2g is refused outright with "Invalid
# thread stack size ... exceeds the maximum representable size" and the JVM then fails to
# start at all, which looks nothing like a stack problem in the build log.
org.gradle.jvmargs=-Xmx4G -Xms1G -Xss1g
