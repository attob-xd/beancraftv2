# TeaVM merges every META-INF/teavm.properties on its classpath. teavm-classlib's own file
# says
#
#     includePackageHierarchy|java=false
#     includePackageHierarchy|javax.xml=false
#
# so TeaVM never reads a java.* class from the classpath - it resolves those through its
# own class library instead. Nothing stops it reading javax.*, sun.*, com.sun.* or jdk.*
# from the JDK the compiler is running on, though, and those are the packages that made
# this port impossible to analyse.
#
# The mechanism: with fastGlobalAnalysis (which 1.18.2 needs, because the precise analysis
# does not fit in memory), a call through a functional interface resolves to every
# implementation TeaVM knows of. Once Swing is readable, its PrivilegedActions answer
# java.security.AccessController.doPrivileged, its BiFunctions answer every Map.compute,
# and UIManager's reflective look-and-feel loader calls Class.newInstance() - which TeaVM
# must model as "any class may be instantiated". The result was Swing, java2d, the image
# codecs and JNDI compiled into a browser build, and thousands of diagnostics whose stack
# traces ran entirely through code that cannot execute here.
#
# Excluding them makes TeaVM report an honest "class not found" for any JDK-only API that
# is genuinely reachable, which is a fixable finding, instead of silently compiling the
# desktop JDK into the page.
includePackageHierarchy|javax=false
includePackageHierarchy|sun=false
includePackageHierarchy|com.sun=false
includePackageHierarchy|jdk=false

# The exclusions above keep TeaVM from reading the desktop JDK. A handful of javax and sun
# types are still NAMED in class metadata that TeaVM evaluates at load time, though - a
# Cipher in Connection.setEncryptionKey, sun.misc.Unsafe on guava's fallback paths - so they
# have to resolve even though nothing can call them. These rules extend the same
# strip-the-T-and-map mechanism the class library uses for java.*, so those shims can live in
# org.teavm.classlib.javax and org.teavm.classlib.sun.
stripPrefixFromPackageHierarchyClasses|org.teavm.classlib.javax=T
mapPackageHierarchy|org.teavm.classlib.javax=javax
stripPrefixFromPackageHierarchyClasses|org.teavm.classlib.sun=T
mapPackageHierarchy|org.teavm.classlib.sun=sun

# JNA is com.sun.jna, which the com.sun exclusion above would otherwise hide along
# with the JDK's own com.sun.*. Vanilla names its Pointer and IntByReference in
# metadata, so the package is let back in; nothing calls into it, because nothing in a
# page can load a native library.
includePackageHierarchy|com.sun.jna=true

# jdk.jfr, same story as javax and sun above: Flight Recorder cannot run in a page,
# but vanilla names its Event and EventType in metadata, so the package is mapped
# back in for shims to live in.
stripPrefixFromPackageHierarchyClasses|org.teavm.classlib.jdk=T
mapPackageHierarchy|org.teavm.classlib.jdk=jdk
